<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Tag Manager PRO</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.mini.min.js"></script>
    <style>
        :root {
            --bg: #0e1621;
            --card: #17212b;
            --card-hover: #202b36;
            --border: #242f3d;
            --text: #f5f5f5;
            --text-secondary: #7f91a4;
            --accent: #5288c1;
            --accent-hover: #4370a3;
            --success: #27ae60;
            --warn: #e74c3c;
            --input-bg: #242f3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        textarea, input[type="text"], input[type="number"] {
            font-size: 16px; /* Захист від автозуму в iOS Safari */
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        textarea:focus, input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--accent);
        }
        textarea {
            width: 100%;
            height: 90px;
            resize: vertical;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            min-height: 44px; /* Зручний тач-таргет */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s, transform 0.1s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        button:hover { opacity: 0.92; }
        button:active { transform: scale(0.98); }
        .btn-success { background: var(--success); }
        .btn-secondary { background: #334456; }
        .btn-danger { background: var(--warn); }

        #opCounter {
            margin: 14px 0 8px 0;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            margin: 10px 0 16px 0;
            max-height: 380px;
            overflow-y: auto;
            padding: 2px;
        }
        .card {
            background: var(--card);
            padding: 10px 12px;
            border-radius: 8px;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            font-size: 14px;
            word-break: break-word;
        }
        .card.active {
            border-color: var(--accent);
            background: rgba(82, 136, 193, 0.12);
        }
        .card input[type="checkbox"] {
            margin-right: 6px;
            transform: scale(1.15);
            cursor: pointer;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 12px;
        }
        .modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 680px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .modal-title {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        .modal-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .search-box {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 15px;
        }
        .modal-body {
            padding: 12px 16px;
            overflow-y: auto;
            flex: 1;
            max-height: 52vh;
        }
        .db-table-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .db-row {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 40px;
            gap: 8px;
            align-items: center;
            background: var(--input-bg);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid transparent;
        }
        .db-row:hover {
            border-color: var(--border);
        }
        .db-row input {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 15px;
            color: var(--text);
            width: 100%;
        }
        .db-row .btn-del {
            background: transparent;
            color: var(--warn);
            border: 1px solid rgba(231, 76, 60, 0.4);
            padding: 0;
            height: 38px;
            width: 38px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            min-height: unset;
        }
        .db-row .btn-del:hover {
            background: rgba(231, 76, 60, 0.2);
        }
        .modal-footer {
            padding: 14px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .modal-footer-btns {
            display: flex;
            gap: 8px;
        }

        /* Mobile Responsive media query */
        @media (max-width: 640px) {
            body { padding: 10px; }
            h2 { font-size: 19px; }
            .controls-grid {
                grid-template-columns: 1fr 1fr;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .db-row {
                grid-template-columns: 75px 1fr 38px;
                gap: 6px;
            }
            .db-row input.row-handle {
                grid-column: 1 / 3;
            }
            .db-row .btn-del {
                grid-column: 3;
                grid-row: 1 / 3;
                height: 100%;
                width: 100%;
            }
            .modal-content {
                max-height: 95vh;
            }
            .modal-footer {
                flex-direction: column;
                align-items: stretch;
            }
            .modal-footer-btns {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<div class="container">
    <h2>📱 TG Tag Manager PRO</h2>
    <textarea id="inputIds" placeholder="Введіть номери операторів: 1, (31), 60, 41..."></textarea>
    
    <div class="controls-grid">
        <button onclick="processInput()">⚡ Process IDs</button>
        <button onclick="document.getElementById('fileImporter').click()" class="btn-success">📥 Import Base</button>
        <input type="file" id="fileImporter" accept=".xlsx, .xls, .json" style="display:none;" onchange="handleFileImport(event)">
        <button onclick="toggleModal()" class="btn-secondary">⚙️ Edit Base</button>
        <button onclick="clearCache()" class="btn-danger">🗑️ Reset All</button>
    </div>

    <div id="opCounter">Вибрано: 0</div>
    <div class="grid" id="operatorGrid"></div>

    <textarea id="tagResult" readonly placeholder="Результат тегів з'явиться тут..." style="margin-top:10px;"></textarea>
    <button onclick="copyTags()" style="margin-top:10px; width:100%;">📋 Copy to Clipboard</button>
</div>

<div id="dbModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title-row">
                <h3 class="modal-title">👥 База операторів</h3>
                <span id="dbTotalCounter" style="color:var(--text-secondary); font-size:13px; background:rgba(255,255,255,0.06); padding:4px 8px; border-radius:12px;">Всього: 0</span>
            </div>
            <div class="modal-toolbar">
                <input type="text" id="dbSearch" class="search-box" placeholder="🔍 Пошук за ID, ім'ям чи тегом..." oninput="renderDbTableRows()">
                <button type="button" onclick="addNewDbRow()" class="btn-success" style="min-height:38px; padding:0 12px; font-size:14px; white-space:nowrap;">+ Додати</button>
            </div>
        </div>
        <div class="modal-body">
            <div id="dbTableContainer" class="db-table-container"></div>
        </div>
        <div class="modal-footer">
            <span style="font-size:13px; color:var(--text-secondary);">Зберігається суто локально в браузері</span>
            <div class="modal-footer-btns">
                <button onclick="saveInteractiveDB()" style="background:var(--accent);">💾 Зберегти</button>
                <button onclick="toggleModal()" class="btn-danger">Закрити</button>
            </div>
        </div>
    </div>
</div>

<script src="script2.js"></script>

</body>
</html>
