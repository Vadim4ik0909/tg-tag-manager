<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Tag Manager PRO</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.mini.min.js"></script>
    <style>
        :root {
            --bg: #17212b;
            --card: #232e3c;
            --card-hover: #2b394a;
            --border: #33404d;
            --text: #f5f5f5;
            --text-secondary: #94a3b8;
            --primary-btn: #2563eb;
            --primary-btn-hover: #1d4ed8;
            --import-btn: #10b981;
            --import-btn-hover: #059669;
            --secondary-btn: #475569;
            --secondary-btn-hover: #334155;
            --danger-btn: #ef4444;
            --danger-btn-hover: #dc2626;
            --warn: #ef4444;
            --input-bg: #1d2733;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 880px;
            margin: 0 auto;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 22px;
            font-weight: 600;
            color: var(--text);
        }
        textarea, input[type="text"], input[type="number"] {
            font-size: 16px; /* Запобігає автозуму в iOS Safari */
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        textarea:focus, input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--primary-btn);
        }
        textarea {
            width: 100%;
            height: 85px;
            resize: vertical;
        }
        .controls-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        button {
            background: var(--primary-btn);
            color: #ffffff;
            border: 1px solid var(--primary-btn);
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s, color 0.15s, border-color 0.15s, transform 0.05s, box-shadow 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        button:hover:not(:disabled) {
            background-color: var(--primary-btn-hover);
            border-color: var(--primary-btn-hover);
        }
        button:active:not(:disabled) {
            transform: scale(0.98);
        }
        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: var(--border) !important;
            color: var(--text-secondary) !important;
            background: transparent !important;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-import {
            background: transparent;
            color: var(--import-btn);
            border: 1px solid var(--import-btn);
        }
        .btn-import:hover:not(:disabled) {
            background-color: var(--import-btn);
            color: #ffffff;
        }
        .btn-export {
            background: transparent;
            color: #38bdf8;
            border: 1px solid #0284c7;
        }
        .btn-export:hover:not(:disabled) {
            background-color: #0284c7;
            color: #ffffff;
        }
        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: var(--secondary-btn-hover);
            color: #ffffff;
            border-color: var(--secondary-btn-hover);
        }
        .btn-danger {
            background: transparent;
            color: var(--danger-btn);
            border: 1px solid var(--danger-btn);
        }
        .btn-danger:hover:not(:disabled) {
            background-color: var(--danger-btn);
            color: #ffffff;
        }

        .btn-pulse-needed {
            background: rgba(16, 185, 129, 0.15) !important;
            color: #10b981 !important;
            border: 1.5px solid #10b981 !important;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
            animation: pulseAttention 2s infinite;
        }
        @keyframes pulseAttention {
            0%, 100% { box-shadow: 0 0 8px rgba(16, 185, 129, 0.3); }
            50% { box-shadow: 0 0 18px rgba(16, 185, 129, 0.6); }
        }

        #opCounter {
            margin: 12px 0 8px 0;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin: 10px 0 16px 0;
            max-height: 380px;
            overflow-y: auto;
            padding: 2px;
        }
        .card {
            background: var(--card);
            padding: 9px 12px;
            border-radius: 8px;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        .card-title {
            color: var(--text);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-title strong {
            font-weight: 600;
        }
        .card-name {
            font-weight: 500;
            color: var(--text);
        }
        .card-subtitle {
            color: var(--text-secondary);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-left: 22px;
        }
        .card.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.12);
        }
        .card.active .card-subtitle {
            color: #60a5fa;
        }
        .card input[type="checkbox"] {
            margin: 0;
            transform: scale(1.1);
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }
        .modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 100%;
            max-width: 680px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 36px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .modal-title {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }
        .modal-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 180px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 14px;
        }
        .btn-filter {
            background: var(--input-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            min-height: 36px;
            transition: background-color 0.15s, color 0.15s;
        }
        .btn-filter.active {
            background: var(--primary-btn);
            color: #fff;
            border-color: var(--primary-btn);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.active {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .status-badge.dismissed {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .modal-body {
            padding: 12px 16px;
            overflow-y: auto;
            flex: 1;
            max-height: 52vh;
        }
        .db-table-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .db-row {
            display: grid;
            grid-template-columns: 65px 1fr 1fr 95px 36px !important;
            gap: 8px;
            align-items: center;
            background: var(--input-bg);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid transparent;
        }
        .db-row:hover {
            border-color: var(--border);
        }
        .db-row input {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 14px;
            color: var(--text);
            width: 100%;
        }
        .db-row .btn-del {
            background: transparent;
            color: var(--warn);
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 0;
            height: 36px;
            width: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            min-height: unset;
        }
        .db-row .btn-del:hover {
            background: rgba(239, 68, 68, 0.15);
        }
        .modal-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .modal-footer-btns {
            display: flex;
            gap: 8px;
        }

        /* Mobile Responsive media query */
        @media (max-width: 640px) {
            body { padding: 12px; }
            h2 { font-size: 20px; }
            .controls-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
            .grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .status-filter-group {
                width: 100%;
                justify-content: space-between;
            }
            .btn-filter {
                flex: 1;
            }
            .db-row {
                grid-template-columns: 65px 1fr 36px !important;
                gap: 6px;
            }
            .db-row input.row-handle {
                grid-column: 1 / 3;
            }
            .db-row .status-col {
                grid-column: 1 / 3;
            }
            .db-row .btn-del {
                grid-column: 3;
                grid-row: 1 / 4;
                height: 100%;
                width: 100%;
            }
            .modal-content {
                max-height: 95vh;
            }
            .modal-footer {
                flex-direction: column;
                align-items: stretch;
            }
            .modal-footer-btns {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<div class="container">
    <h2>Telegram Tag Manager</h2>
    <textarea id="inputIds" placeholder="Введіть номери: 1, (31), 60"></textarea>
    
    <div class="controls-grid">
        <button id="btnProcess" onclick="processInput()">Process IDs</button>
        <button id="btnImport" onclick="document.getElementById('fileImporter').click()" class="btn-import">Import Base (Excel/JSON)</button>
        <button id="btnExport" type="button" onclick="exportDbToExcel()" class="btn-export">Export Base (Excel)</button>
        <input type="file" id="fileImporter" accept=".xlsx, .xls, .json" style="display:none;" onchange="handleFileImport(event)">
        <button id="btnEdit" onclick="toggleModal()" class="btn-secondary">Edit Base</button>
        <button id="btnReset" onclick="clearCache()" class="btn-danger">Reset All</button>
    </div>

    <div id="opCounter">Вибрано: 0</div>
    <div class="grid" id="operatorGrid"></div>

    <textarea id="tagResult" readonly placeholder="Результат тегів..." style="margin-top:10px;"></textarea>
    <button onclick="copyTags()" style="margin-top:10px; width:100%;">Copy to Clipboard</button>
</div>

<div id="dbModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title-row">
                <h3 class="modal-title">Редагування бази</h3>
                <span id="dbTotalCounter" style="color:var(--text-secondary); font-size:13px;">Всього: 0</span>
            </div>
            <div class="modal-toolbar">
                <input type="text" id="dbSearch" class="search-box" placeholder="Пошук за ID, ім'ям або тегом..." oninput="renderDbTableRows()">
                <div class="status-filter-group" style="display:flex; gap:4px; margin-left:auto;">
                    <button type="button" class="btn-filter active" onclick="setDbStatusFilter('all', this)">Усі</button>
                    <button type="button" class="btn-filter" onclick="setDbStatusFilter('active', this)">Активні</button>
                    <button type="button" class="btn-filter" onclick="setDbStatusFilter('dismissed', this)">Звільнені</button>
                </div>
                <button type="button" onclick="addNewDbRow()" class="btn-import" style="min-height:36px; padding:0 12px; font-size:13px;">+ Додати</button>
            </div>
        </div>
        <div class="modal-body">
            <div id="dbTableContainer" class="db-table-container"></div>
        </div>
        <div class="modal-footer">
            <span style="font-size:13px; color:var(--text-secondary);">Зберігається локально у браузері</span>
            <div class="modal-footer-btns">
                <button type="button" onclick="exportDbToExcel()" class="btn-import">Export Excel</button>
                <button onclick="saveInteractiveDB()">Save & Reload</button>
                <button onclick="toggleModal()" class="btn-danger">Close</button>
            </div>
        </div>
    </div>
</div>

<script src="script2.js"></script>

</body>
</html>
